name: Integration Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  integration-tests:
    name: Integration / Docker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Allow unprivileged user namespaces (needed by Apptainer)
        # Ubuntu 24.04 (this runner's image) restricts unprivileged user
        # namespace creation to processes with CAP_SYS_ADMIN or an AppArmor
        # profile permitting it. The slurm_node container's `slurm` user has
        # neither, so Apptainer's unprivileged build/exec fails with
        # "Could not write info to setgroups: Permission denied" regardless
        # of the container's own Docker security_opt/privileged settings -
        # this is a host kernel sysctl, not something a container flag can
        # override. Safe here since it's a disposable CI VM.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build slurm-base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: slurm_environment/Dockerfile
          target: slurm-base
          load: true
          cache-from: type=gha,scope=slurm-base
          cache-to: type=gha,mode=max,scope=slurm-base

      - name: Build submitter image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: slurm_environment/Dockerfile
          target: submitter
          load: true
          tags: prefect-slurm-submitter:latest
          cache-from: type=gha,scope=submitter
          cache-to: type=gha,mode=max,scope=submitter

      - name: Run integration tests
        run: uv run pytest -m integration -v -s --tb=long
        timeout-minutes: 20
