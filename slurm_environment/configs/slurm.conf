# slurm.conf file generated by configurator.html.
# Put this file on all nodes of your cluster.
# See the slurm.conf man page for more information.
#
ClusterName=donco
SlurmctldHost=slurm_node
MpiDefault=none
ProctrackType=proctrack/linuxproc
ReturnToService=1
SlurmctldPidFile=/var/run/slurm/slurmctld.pid
SlurmctldPort=6817
SlurmdPidFile=/var/run/slurm/slurmd.pid
SlurmdPort=6818
SlurmdSpoolDir=/var/spool/slurmd
SlurmUser=slurm
StateSaveLocation=/var/spool/slurmctld
SwitchType=switch/none
TaskPlugin=task/none
SlurmdUser=root
# Trust configured node hardware instead of draining on topology-detection
# mismatches (seen on some hosts, e.g. ARM/virtualized CPUs reporting a
# different socket/core/thread layout than CPUs= alone implies).
SlurmdParameters=config_overrides

# TIMERS
InactiveLimit=0
KillWait=30
MinJobAge=300
SlurmctldTimeout=120
SlurmdTimeout=300
Waittime=0

# SCHEDULING
SchedulerType=sched/backfill
SelectType=select/cons_tres

# LOGGING AND ACCOUNTING
AccountingStorageHost=slurm_node
AccountingStoragePort=6819
AccountingStorageType=accounting_storage/slurmdbd
JobAcctGatherFrequency=30
JobAcctGatherType=jobacct_gather/none
SlurmctldDebug=debug
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdDebug=debug
SlurmdLogFile=/var/log/slurm/slurmd.log

# COMPUTE NODES
NodeName=slurm_node CPUs=4 RealMemory=1900 State=UNKNOWN
NodeName=prefect-agent  # login/submit node
PartitionName=debug Nodes=slurm_node Default=YES MaxTime=INFINITE State=UP
PartitionName=datamover Nodes=slurm_node Default=NO MaxTime=INFINITE State=UP

# Authentication info
AuthAltTypes=auth/jwt
AuthAltParameters=jwt_key=/var/spool/slurmctld/jwt_hs256.key
